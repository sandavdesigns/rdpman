name: Build Windows App

on:
  push:
    branches:
      - main
    paths-ignore:
      - "builds/**"
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build portable Windows package
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"

      - name: Restore
        run: dotnet restore .\RdpMan.Desktop.sln

      - name: Build
        run: dotnet build .\RdpMan.Desktop.sln --configuration Release --no-restore

      - name: Read app version
        shell: pwsh
        run: |
          [xml]$project = Get-Content .\src\RdpMan.Desktop\RdpMan.Desktop.csproj
          $version = $project.Project.PropertyGroup.Version
          "RDPMAN_VERSION=$version" >> $env:GITHUB_ENV

      - name: Publish win-x64
        run: >
          dotnet publish .\src\RdpMan.Desktop\RdpMan.Desktop.csproj
          --configuration Release
          --runtime win-x64
          --self-contained false
          -p:PublishSingleFile=false
          -p:PublishReadyToRun=false
          --output .\artifacts\RDPMan-win-x64

      - name: Package zip
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path .\artifacts\zip | Out-Null
          Compress-Archive -Path .\artifacts\RDPMan-win-x64\* -DestinationPath ".\artifacts\zip\RDPMan-$env:RDPMAN_VERSION-win-x64.zip" -Force

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: RDPMan-${{ env.RDPMAN_VERSION }}-win-x64
          path: .\artifacts\zip\RDPMan-${{ env.RDPMAN_VERSION }}-win-x64.zip
          if-no-files-found: error

      - name: Commit ZIP into builds folder
        if: github.ref == 'refs/heads/main'
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path .\builds | Out-Null
          Copy-Item ".\artifacts\zip\RDPMan-$env:RDPMAN_VERSION-win-x64.zip" ".\builds\RDPMan-$env:RDPMAN_VERSION-win-x64.zip" -Force
          Copy-Item ".\artifacts\zip\RDPMan-$env:RDPMAN_VERSION-win-x64.zip" ".\builds\RDPMan-latest-win-x64.zip" -Force
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .\builds
          if (git diff --cached --quiet) {
            Write-Host "No build ZIP changes to commit."
          } else {
            git commit -m "Update RDPMan Windows build $env:RDPMAN_VERSION [skip ci]"
            git push
          }

      - name: Create GitHub release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: .\artifacts\zip\RDPMan-${{ env.RDPMAN_VERSION }}-win-x64.zip
          generate_release_notes: true
