services:
  rdpman:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: rdpman
    restart: unless-stopped
    ports:
      - "8095:8000"
    volumes:
      - rdpman_data:/app/data
    environment:
      RDP_MAN_SECRET_KEY: "${RDP_MAN_SECRET_KEY}"
      RDP_MAN_ADMIN_USERNAME: "${RDP_MAN_ADMIN_USERNAME}"
      RDP_MAN_ADMIN_PASSWORD: "${RDP_MAN_ADMIN_PASSWORD}"
      RDP_MAN_API_TOKEN: "${RDP_MAN_API_TOKEN}"
      RDP_MAN_DATABASE_URL: "sqlite:////app/data/rdpman.sqlite3"
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health').read()\""]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s

volumes:
  rdpman_data:

