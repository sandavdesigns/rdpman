services:
  rdpman:
    build: .
    container_name: rdpman
    restart: unless-stopped
    ports:
      - "8095:8000"
    volumes:
      - rdpman_data:/app/data
    environment:
      RDP_MAN_SECRET_KEY: "${RDP_MAN_SECRET_KEY:-change-this-to-a-long-random-secret}"
      RDP_MAN_ADMIN_USERNAME: "${RDP_MAN_ADMIN_USERNAME:-admin}"
      RDP_MAN_ADMIN_PASSWORD: "${RDP_MAN_ADMIN_PASSWORD:-change-me}"
      RDP_MAN_API_TOKEN: "${RDP_MAN_API_TOKEN:-change-me-api-token}"
      RDP_MAN_DATABASE_URL: "${RDP_MAN_DATABASE_URL:-sqlite:////app/data/rdpman.sqlite3}"

volumes:
  rdpman_data:

